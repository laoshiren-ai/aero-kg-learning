<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="620" fill="#f8fafc"/>
  <text x="450" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">活塞式发动机 · 四冲程工作原理</text>

  <defs>
    <marker id="fb" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="fo" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- 四个气缸面板 -->
  <!-- 面板参数：x 起点，活塞顶 y，状态 -->
  <g stroke="#334155" stroke-width="3" fill="none">
    <!-- 气缸壁 -->
    <path d="M78,120 V330 M192,120 V330"/>
    <path d="M288,120 V330 M402,120 V330"/>
    <path d="M498,120 V330 M612,120 V330"/>
    <path d="M708,120 V330 M822,120 V330"/>
  </g>

  <!-- 气缸盖（含气门座） -->
  <g fill="#e2e8f0" stroke="#334155" stroke-width="2">
    <rect x="70" y="100" width="130" height="20" rx="3"/>
    <rect x="280" y="100" width="130" height="20" rx="3"/>
    <rect x="490" y="100" width="130" height="20" rx="3"/>
    <rect x="700" y="100" width="130" height="20" rx="3"/>
  </g>

  <!-- ══ 面板1 进气：活塞下止点，进气门开 ══ -->
  <g>
    <rect x="80" y="272" width="110" height="34" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <line x1="135" y1="306" x2="135" y2="392" stroke="#64748b" stroke-width="5"/>
    <circle cx="135" cy="412" r="24" fill="none" stroke="#64748b" stroke-width="4"/>
    <!-- 进气门开（蓝，下移） -->
    <circle cx="103" cy="128" r="9" fill="#2563eb"/>
    <line x1="103" y1="128" x2="103" y2="152" stroke="#2563eb" stroke-width="4"/>
    <!-- 排气门关 -->
    <circle cx="167" cy="116" r="9" fill="#94a3b8"/>
    <!-- 进气箭头 -->
    <line x1="48" y1="150" x2="92" y2="150" stroke="#2563eb" stroke-width="4" marker-end="url(#fb)"/>
    <text x="60" y="136" font-size="13" fill="#2563eb">混合气</text>
  </g>

  <!-- ══ 面板2 压缩：活塞上止点，双门关 ══ -->
  <g>
    <rect x="290" y="164" width="110" height="34" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <line x1="345" y1="198" x2="345" y2="398" stroke="#64748b" stroke-width="5"/>
    <circle cx="345" cy="412" r="24" fill="none" stroke="#64748b" stroke-width="4"/>
    <circle cx="313" cy="116" r="9" fill="#94a3b8"/>
    <circle cx="377" cy="116" r="9" fill="#94a3b8"/>
    <!-- 上行箭头 -->
    <line x1="418" y1="290" x2="418" y2="220" stroke="#ea580c" stroke-width="4" marker-end="url(#fo)"/>
    <text x="408" y="312" font-size="13" fill="#ea580c">压缩</text>
  </g>

  <!-- ══ 面板3 做功：火花塞点火，活塞被推下 ══ -->
  <g>
    <rect x="500" y="230" width="110" height="34" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <line x1="555" y1="264" x2="555" y2="392" stroke="#64748b" stroke-width="5"/>
    <circle cx="555" cy="412" r="24" fill="none" stroke="#64748b" stroke-width="4"/>
    <circle cx="523" cy="116" r="9" fill="#94a3b8"/>
    <circle cx="587" cy="116" r="9" fill="#94a3b8"/>
    <!-- 火花塞 -->
    <rect x="549" y="82" width="12" height="20" fill="#f59e0b"/>
    <!-- 爆发 -->
    <circle cx="555" cy="160" r="24" fill="#fbbf24" opacity="0.85"/>
    <circle cx="555" cy="160" r="13" fill="#f97316"/>
    <line x1="628" y1="220" x2="628" y2="296" stroke="#dc2626" stroke-width="4" marker-end="url(#fo)"/>
    <text x="618" y="318" font-size="13" fill="#dc2626">做功</text>
  </g>

  <!-- ══ 面板4 排气：排气门开，活塞上行 ══ -->
  <g>
    <rect x="710" y="190" width="110" height="34" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <line x1="765" y1="224" x2="765" y2="398" stroke="#64748b" stroke-width="5"/>
    <circle cx="765" cy="412" r="24" fill="none" stroke="#64748b" stroke-width="4"/>
    <circle cx="733" cy="116" r="9" fill="#94a3b8"/>
    <circle cx="797" cy="128" r="9" fill="#dc2626"/>
    <line x1="797" y1="128" x2="797" y2="152" stroke="#dc2626" stroke-width="4"/>
    <line x1="810" y1="150" x2="858" y2="150" stroke="#64748b" stroke-width="4" marker-end="url(#fb)"/>
    <text x="812" y="136" font-size="13" fill="#64748b">废气</text>
    <line x1="848" y1="290" x2="848" y2="226" stroke="#ea580c" stroke-width="4" marker-end="url(#fo)"/>
  </g>

  <!-- 冲程标题 -->
  <g font-size="19" font-weight="600" fill="#0f172a" text-anchor="middle">
    <text x="135" y="472">① 进气冲程</text>
    <text x="345" y="472">② 压缩冲程</text>
    <text x="555" y="472">③ 做功冲程</text>
    <text x="765" y="472">④ 排气冲程</text>
  </g>
  <g font-size="14" fill="#64748b" text-anchor="middle">
    <text x="135" y="498">进气门开，吸入混合气</text>
    <text x="345" y="498">双门关闭，气温气压升高</text>
    <text x="555" y="498">点火燃气膨胀，推动活塞</text>
    <text x="765" y="498">排气门开，排出废气</text>
  </g>

  <rect x="150" y="530" width="600" height="60" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="450" y="556" text-anchor="middle" font-size="16" fill="#9a3412">四个冲程 = 曲轴转两圈，其中只有「做功冲程」输出动力</text>
  <text x="450" y="580" text-anchor="middle" font-size="15" fill="#c2410c">航空活塞发动机多为多缸星型 / 直列排列，轮流做功保证输出平稳</text>
</svg>
