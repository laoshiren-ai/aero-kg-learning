<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="520" fill="#f8fafc"/>
  <text x="450" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">马赫锥 —— 声源以超声速运动时的扰动波前</text>

  <!-- 扰动圆（1秒前 / 2秒前发出的波） -->
  <circle cx="460" cy="260" r="240" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="600" cy="260" r="120" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="460" y="36" font-size="0" fill="none"/>
  <text x="330" y="472" font-size="14" fill="#94a3b8">2 秒前发出的扰动波</text>
  <text x="556" y="404" font-size="14" fill="#94a3b8">1 秒前</text>

  <!-- 马赫锥两条边界线（v = 2c，半角 30°） -->
  <line x1="740" y1="260" x2="500" y2="90" stroke="#dc2626" stroke-width="4"/>
  <line x1="740" y1="260" x2="500" y2="430" stroke="#dc2626" stroke-width="4"/>
  <text x="492" y="72" font-size="17" fill="#dc2626" font-weight="600">马赫锥</text>

  <!-- 声源当前位置与历史位置 -->
  <circle cx="740" cy="260" r="12" fill="#dc2626"/>
  <circle cx="600" cy="260" r="6" fill="#64748b"/>
  <circle cx="460" cy="260" r="6" fill="#cbd5e1"/>
  <line x1="460" y1="260" x2="728" y2="260" stroke="#64748b" stroke-width="2.5" stroke-dasharray="5 5"/>
  <text x="740" y="304" text-anchor="middle" font-size="16" fill="#dc2626" font-weight="600">声源当前位置</text>
  <text x="740" y="326" text-anchor="middle" font-size="14" fill="#64748b">（运动方向 →）</text>

  <!-- 半角标注 -->
  <path d="M690,260 A50,50 0 0 0 683,236" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="662" y="230" font-size="16" fill="#0f172a" font-weight="600">μ</text>

  <!-- 说明框 -->
  <rect x="90" y="392" width="720" height="98" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="450" y="422" text-anchor="middle" font-size="18" fill="#1d4ed8" font-weight="600">sin μ = c / v = 1 / Ma</text>
  <text x="450" y="448" text-anchor="middle" font-size="15.5" fill="#334155">声源速度 v 越大，扰动波被甩得越远，马赫锥越尖（μ 越小）；</text>
  <text x="450" y="472" text-anchor="middle" font-size="15.5" fill="#334155">图中取 Ma = 2，故 μ = 30°。锥面即「激波面」，扫过时地面听到声爆。</text>
</svg>
