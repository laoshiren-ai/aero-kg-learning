<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="580" fill="#f8fafc"/>
  <text x="450" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">三个宇宙速度 —— 速度决定轨道的「开度」</text>

  <!-- 地球 -->
  <circle cx="300" cy="330" r="180" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/>
  <path d="M240,300 C270,288 320,292 350,306 C330,330 280,334 240,300 Z" fill="#bbf7d0" opacity="0.9"/>
  <path d="M250,390 C300,376 360,382 390,398 C350,420 280,418 250,390 Z" fill="#bbf7d0" opacity="0.9"/>
  <text x="300" y="360" text-anchor="middle" font-size="20" fill="#1e40af" font-weight="700">地球</text>

  <!-- 高山发射点 -->
  <path d="M270,168 L300,118 L330,168 Z" fill="#64748b"/>
  <circle cx="300" cy="106" r="9" fill="#dc2626"/>

  <!-- v=7.9：近地圆轨道 -->
  <circle cx="300" cy="330" r="224" fill="none" stroke="#059669" stroke-width="3.5" stroke-dasharray="10 6"/>
  <!-- v=11.2：椭圆（脱离地球前绕一圈） -->
  <ellipse cx="380" cy="330" rx="330" ry="190" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-dasharray="2 7" transform="rotate(-8 380 330)"/>
  <!-- v=16.7：双曲线（飞出太阳系） -->
  <path d="M300,106 C420,84 560,60 700,40 M300,106 C360,170 430,300 470,470" fill="none" stroke="#dc2626" stroke-width="3.5"/>

  <!-- 速度标注 -->
  <text x="470" y="128" font-size="16.5" fill="#059669" font-weight="600">7.9 km/s（第一宇宙速度）</text>
  <text x="470" y="152" font-size="14" fill="#059669">绕地球做圆轨道飞行（人造卫星）</text>
  <text x="600" y="204" font-size="16.5" fill="#2563eb" font-weight="600">11.2 km/s（第二宇宙速度）</text>
  <text x="600" y="228" font-size="14" fill="#2563eb">脱离地球引力，成为太阳的行星</text>
  <text x="640" y="66" font-size="16.5" fill="#dc2626" font-weight="600">16.7 km/s（第三宇宙速度）</text>
  <text x="640" y="90" font-size="14" fill="#dc2626">飞出太阳系，进入恒星际空间</text>

  <!-- 注释 -->
  <rect x="120" y="496" width="660" height="56" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="450" y="520" text-anchor="middle" font-size="16" fill="#1d4ed8">发射速度越大，轨道越「开」：圆 / 椭圆 → 抛物线（恰好逃逸）→ 双曲线（加速逃逸）</text>
  <text x="450" y="543" text-anchor="middle" font-size="14.5" fill="#64748b">齐奥尔科夫斯基与牛顿大炮思想实验的现代结论</text>
</svg>
