<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="520" fill="#f8fafc"/>
  <text x="450" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">涡轮喷气发动机 · 气流参数沿程变化</text>

  <defs>
    <marker id="jb" markerWidth="8" markerHeight="6" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 机匣外壳 -->
  <path d="M80,180 H820" stroke="#334155" stroke-width="4" fill="none"/>
  <path d="M80,340 H820" stroke="#334155" stroke-width="4" fill="none"/>
  <!-- 进气唇口与尾喷口收敛 -->
  <path d="M80,180 C110,186 116,220 130,238 M80,340 C110,334 116,300 130,302" stroke="#334155" stroke-width="4" fill="none"/>
  <path d="M760,180 C790,206 800,230 828,238 M760,340 C790,314 800,290 828,282" stroke="#334155" stroke-width="4" fill="none"/>
  <!-- 整流锥 -->
  <path d="M60,290 L130,262 L130,318 Z" fill="#64748b"/>

  <!-- 站位分隔虚线 -->
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5">
    <line x1="180" y1="170" x2="180" y2="350"/>
    <line x1="400" y1="170" x2="400" y2="350"/>
    <line x1="540" y1="170" x2="540" y2="350"/>
    <line x1="700" y1="170" x2="700" y2="350"/>
  </g>

  <!-- 压气机叶片（斜线列） -->
  <g stroke="#64748b" stroke-width="3">
    <line x1="200" y1="240" x2="216" y2="280"/><line x1="228" y1="240" x2="244" y2="280"/>
    <line x1="256" y1="240" x2="272" y2="280"/><line x1="284" y1="240" x2="300" y2="280"/>
    <line x1="312" y1="240" x2="328" y2="280"/><line x1="340" y1="240" x2="356" y2="280"/>
    <line x1="368" y1="240" x2="384" y2="280"/>
  </g>
  <!-- 涡轮叶片 -->
  <g stroke="#64748b" stroke-width="3">
    <line x1="560" y1="240" x2="544" y2="280"/><line x1="588" y1="240" x2="572" y2="280"/>
    <line x1="616" y1="240" x2="600" y2="280"/><line x1="644" y1="240" x2="628" y2="280"/>
    <line x1="672" y1="240" x2="656" y2="280"/>
  </g>
  <!-- 轴 -->
  <line x1="200" y1="260" x2="700" y2="260" stroke="#334155" stroke-width="5" opacity="0.35"/>

  <!-- 燃烧室火焰 -->
  <path d="M420,260 C428,240 452,240 460,256 C468,240 492,240 500,258 C492,276 468,278 460,264 C452,280 428,278 420,260 Z" fill="#f97316"/>
  <circle cx="460" cy="258" r="7" fill="#fde047"/>
  <text x="460" y="316" text-anchor="middle" font-size="13.5" fill="#ea580c">燃油喷入 · 等压加热</text>

  <!-- 速度曲线（蓝，上）：进气中速→压气机略降→燃烧室升温→涡轮略降→喷管大升 -->
  <polyline points="95,232 180,236 290,246 400,236 470,206 540,214 620,228 700,214 810,164"
            fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#jb)"/>
  <!-- 压强曲线（红，下）：压气机大升→燃烧室保持→涡轮下降→喷管下降 -->
  <polyline points="95,290 180,288 290,262 400,252 470,276 540,296 620,318 700,330 810,336"
            fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 5"/>

  <!-- 图例 -->
  <line x1="120" y1="112" x2="170" y2="112" stroke="#2563eb" stroke-width="4"/>
  <text x="180" y="117" font-size="15" fill="#2563eb">气流速度</text>
  <line x1="300" y1="112" x2="350" y2="112" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 5"/>
  <text x="360" y="117" font-size="15" fill="#dc2626">气体压强</text>

  <!-- 站位标签 -->
  <g font-size="16.5" font-weight="600" fill="#0f172a" text-anchor="middle">
    <text x="130" y="392">进气道</text>
    <text x="290" y="392">压气机</text>
    <text x="470" y="392">燃烧室</text>
    <text x="620" y="392">涡轮</text>
    <text x="780" y="392">尾喷管</text>
  </g>
  <g font-size="13.5" fill="#64748b" text-anchor="middle">
    <text x="130" y="414">减速增压</text>
    <text x="290" y="414">对气体做功</text>
    <text x="470" y="414">化学能→热能</text>
    <text x="620" y="414">燃气带动压气机</text>
    <text x="780" y="414">热能→动能</text>
  </g>

  <!-- 推力箭头 -->
  <line x1="60" y1="460" x2="180" y2="460" stroke="#dc2626" stroke-width="0" />
  <rect x="150" y="446" width="600" height="52" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="450" y="480" text-anchor="middle" font-size="16.5" fill="#991b1b" font-weight="600">推力 = 尾喷管高速喷出燃气的反作用力（牛顿第三定律）</text>
</svg>
