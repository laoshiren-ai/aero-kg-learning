<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="540" fill="#f8fafc"/>
  <text x="450" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">迎角增大 → 气流分离 → 失速</text>

  <defs>
    <marker id="tb" markerWidth="8" markerHeight="6" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- ══ 面板1：小迎角，附着流 ══ -->
  <g transform="translate(40,120)">
    <line x1="0" y1="150" x2="270" y2="150" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M20,150 C60,132 160,128 250,146 C170,168 80,170 20,150 Z" fill="#dbeafe" stroke="#1e40af" stroke-width="3" transform="rotate(-4 135 150)"/>
    <path d="M0,86 C70,70 200,70 280,88" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#tb)"/>
    <path d="M0,116 C80,102 200,100 278,116" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#tb)"/>
    <text x="135" y="242" text-anchor="middle" font-size="17" fill="#0f172a" font-weight="600">迎角小（α ≈ 4°）</text>
    <text x="135" y="266" text-anchor="middle" font-size="14.5" fill="#16a34a">气流全部贴附翼面 · 升力随迎角增大</text>
  </g>

  <!-- ══ 面板2：接近临界，后缘开始分离 ══ -->
  <g transform="translate(320,110)">
    <line x1="0" y1="160" x2="270" y2="160" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M20,160 C60,142 160,138 250,156 C170,178 80,180 20,160 Z" fill="#dbeafe" stroke="#1e40af" stroke-width="3" transform="rotate(-12 135 160)"/>
    <path d="M0,66 C80,48 190,48 278,66" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#tb)"/>
    <path d="M0,100 C60,86 140,84 190,96 C205,100 215,112 208,124" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#tb)"/>
    <!-- 后缘旋涡 -->
    <path d="M212,132 C230,124 244,132 240,148 C236,162 218,162 214,150 C210,140 220,132 232,136" fill="none" stroke="#ea580c" stroke-width="2.5"/>
    <text x="228" y="186" font-size="14" fill="#ea580c">分离旋涡</text>
    <text x="135" y="252" text-anchor="middle" font-size="17" fill="#0f172a" font-weight="600">接近临界迎角（α ≈ 14°）</text>
    <text x="135" y="276" text-anchor="middle" font-size="14.5" fill="#ea580c">上翼面后缘开始出现分离</text>
  </g>

  <!-- ══ 面板3：超过临界迎角，失速 ══ -->
  <g transform="translate(600,100)">
    <line x1="0" y1="170" x2="270" y2="170" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M20,170 C60,152 160,148 250,166 C170,188 80,190 20,170 Z" fill="#fee2e2" stroke="#b91c1c" stroke-width="3" transform="rotate(-20 135 170)"/>
    <path d="M0,60 C70,44 160,44 230,60" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#tb)"/>
    <!-- 大范围分离波状流 -->
    <path d="M0,110 C40,86 60,140 100,112 C130,90 140,146 180,116 C210,96 230,140 262,120" fill="none" stroke="#dc2626" stroke-width="2.8"/>
    <path d="M100,150 C126,138 150,158 176,148 C200,140 216,156 240,150" fill="none" stroke="#dc2626" stroke-width="2.2" opacity="0.75"/>
    <text x="130" y="204" font-size="14.5" fill="#dc2626" font-weight="600">大面积分离 · 湍流尾迹</text>
    <text x="135" y="262" text-anchor="middle" font-size="17" fill="#0f172a" font-weight="600">超过临界迎角（失速）</text>
    <text x="135" y="286" text-anchor="middle" font-size="14.5" fill="#dc2626">升力骤降 · 阻力剧增 · 机头易下坠</text>
  </g>

  <!-- 结论 -->
  <rect x="90" y="446" width="720" height="60" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="450" y="472" text-anchor="middle" font-size="16.5" fill="#9a3412">失速的本质是「气流分离」，不是速度不够 —— 恢复办法：推杆减小迎角，让气流重新贴附翼面</text>
  <text x="450" y="495" text-anchor="middle" font-size="14.5" fill="#c2410c">增升装置（襟翼 / 前缘缝翼）通过推迟分离，提高临界迎角与最大升力系数</text>
</svg>
